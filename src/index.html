<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Civic Lens Demo</title>
  <meta name="description" content="Describe an object, then tap the ground to place it in AR.">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>
</head>

<body>
<script src="bundle.js"></script>
<!-- Copyright (c) 2022 8th Wall, Inc. -->
<!-- body.html is optional; elements will be added to your html body after app.js is loaded. -->

<div class="over">
  <!-- Shown once the site is anchored -->
  <form id="promptForm" hidden>
    <input id="promptInput" type="text" placeholder="Describe an object, e.g. a park bench"
      maxlength="200" autocomplete="off" required>
    <button type="submit">Create</button>
  </form>
  <span id="status">Point your camera at the SoftMind logo to start</span>
  <span id="credit"></span>
  <!-- Shown once the site is anchored: re-averages the logo's pose on the next sightings -->
  <button id="resyncButton" type="button" hidden>Resync</button>
</div>

<!-- prompt-ui picks the model from a text prompt, tap-place places it where the ground is tapped,
     and gumball moves or rotates a placed object after it is tapped. site-anchor locks the shared
     site frame to the SoftMind logo; site-debug shows its debug view with ?debug=1. -->
<a-scene
  tap-place
  prompt-ui
  gumball
  site-anchor
  site-debug
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrweb="
    allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5; 
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;">

  <!-- We can define assets here to be loaded when A-Frame initializes -->
  <a-assets>
    <img id="groundTex" src="assets/sand.jpg">
  </a-assets>

  <!-- The raycaster will emit mouse events on scene objects specified with the cantap class -->
  <a-camera
    id="camera"
    position="0 8 8"
    raycaster="objects: .cantap"
    cursor="
      fuse: false;
      rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 40;
      shadowCameraBottom: -40;
      shadowCameraRight: 40;
      shadowCameraLeft: -40;
      target: #camera"
    xrextras-attach="target: camera; offset: 8 15 4"
    position="1 4.3 2.5"
    shadow>
  </a-entity>

  <a-light type="ambient" intensity="0.5"></a-light>

  <!-- Shared site frame, hidden until the logo has been scanned (see site-anchor.js). Positions
       inside #siteFrame are real-world meters; placed objects are added to it. -->
  <a-entity id="siteRoot" visible="false">
    <a-entity id="siteFrame">
      <!-- The floor: 200 m square, top face at y = 0. The cantap class lets it be tapped. -->
      <a-box
        id="ground"
        class="cantap"
        scale="200 2 200"
        position="0 -1 0"
        material="shader: shadow; transparent: true; opacity: 0.4"
        shadow>
      </a-box>
    </a-entity>
  </a-entity>
</a-scene>

</body>

</html>
